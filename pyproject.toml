[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lorehub"
version = "0.1.0"
description = "Agent-driven knowledge extraction with independently usable CLIs and Skills."
requires-python = ">=3.12"
license = "GPL-3.0-only"

[project.scripts]
lorehub = "lorehub.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "PyYAML>=6,<7", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lorehub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
